<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog - Urban Mess</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fff;
    }

    /* 화면 전체를 채우는 가로 스크롤 컨테이너 */
    .catalog-scroll-container {
      width: 100vw;
      height: 100vh;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      display: flex;
      align-items: center;
      -webkit-overflow-scrolling: touch;
      cursor: grab;
      scrollbar-width: none; /* 파이어폭스 스크롤바 숨김 */
    }

    /* 크롬/사파리 스크롤바 숨김 */
    .catalog-scroll-container::-webkit-scrollbar {
      display: none;
    }

    .catalog-scroll-container:active {
      cursor: grabbing;
    }

    /* 이미지들을 빈틈없이 이어주는 트랙 */
    .catalog-track {
      display: flex;
      height: 100vh;
      align-items: center;
    }

    /* 각 이미지가 화면 높이에 맞춰 100% 꽉 채워지며 붙음 */
    .catalog-track img {
      height: 100vh;
      width: auto;
      display: block;
      object-fit: cover;
      pointer-events: none; /* 드래그 시 이미지 선택 및 튀김 방지 */
    }
  </style>
</head>
<body>

  <!-- 가로 스크롤 전용 영역 (UI 제거) -->
  <main class="catalog-scroll-container" id="scrollContainer">
    <div class="catalog-track">
      <img src="urban mess final print3.jpg" alt="Urban Mess Catalog 3">
      <img src="urban mess final print4.jpg" alt="Urban Mess Catalog 4">
      <img src="urban mess final print5.jpg" alt="Urban Mess Catalog 5">
      <img src="urban mess final print6.jpg" alt="Urban Mess Catalog 6">
    </div>
  </main>

  <script>
    const scrollContainer = document.getElementById('scrollContainer');

    // 1. 마우스 휠(상하 스크롤)을 가로 스크롤로 자연스럽게 전환
    scrollContainer.addEventListener('wheel', (e) => {
      if (e.deltaY !== 0) {
        e.preventDefault();
        scrollContainer.scrollLeft += e.deltaY;
      }
    }, { passive: false });

    // 2. 마우스 드래그로 손쉽게 스크롤
    let isDown = false;
    let startX;
    let scrollLeft;

    scrollContainer.addEventListener('mousedown', (e) => {
      isDown = true;
      startX = e.pageX - scrollContainer.offsetLeft;
      scrollLeft = scrollContainer.scrollLeft;
    });

    scrollContainer.addEventListener('mouseleave', () => {
      isDown = false;
    });

    scrollContainer.addEventListener('mouseup', () => {
      isDown = false;
    });

    scrollContainer.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - scrollContainer.offsetLeft;
      const walk = (x - startX) * 2; // 스크롤 감도
      scrollContainer.scrollLeft = scrollLeft - walk;
    });
  </script>

</body>
</html>
