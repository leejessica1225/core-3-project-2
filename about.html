<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About: - Urban Mess</title>
  <style>
    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Lay Grotesk', sans-serif;
      font-weight: 400;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fff;
    }

    .container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .header {
      padding: 14px 20px;
      border-bottom: 2px solid #000;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .header h1 {
      font-size: 8.8vw;
      line-height: 0.92;
      font-weight: 500;
      letter-spacing: -0.025em;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      padding-top: 6px;
    }

    .nav-menu a {
      text-decoration: none;
      color: #000;
      font-size: 1.8vw;
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    .nav-menu a:hover {
      opacity: 0.6;
    }

    .main-content {
      flex: 1;
      background-color: #fff;
      position: relative;
    }

    .footer-box {
      height: 4.2vh;
      border-top: 2px solid #000;
      background-color: #fff;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>About:</h1>
      <nav class="nav-menu">
        <a href="about.html">About</a>
        <a href="#">Text</a>
      </nav>
    </div>

    <div class="main-content">
      <!-- 본문 내용 들어갈 자리 -->
    </div>

    <div class="footer-box">
      
    </div>
  </div>

</body>
</html>
