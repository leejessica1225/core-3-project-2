<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Urban Mess: - Street View</title>

  <style>
    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: 'Lay Grotesk', sans-serif; 
      font-weight: 400;
    }

    body, html { 
      width: 100vw; 
      height: 100%; 
      height: 100dvh; 
      overflow: hidden; 
      background-color: #000; 
    }

    #street-view {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    /* Home 버튼 */
    .home-btn {
      position: fixed;
      top: 30px;
      right: 30px;
      z-index: 100;
      background: #ffffff;
      color: #000000;
      border: 1.5px solid #000000;
      padding: 8px 16px;
      font-size: 0.9rem;
      text-decoration: none;
    }

    /* 커스텀 오버레이 스티커 스타일 */
    .custom-sticker-overlay {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.5));
      transition: transform 0.15s ease;
    }

    .custom-sticker-overlay:hover {
      transform: translate(-50%, -50%) scale(1.08);
    }

    /* 스티커 정보 카드 팝업 (가로 380px 고정) */
    .info-card-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 380px;
      background-color: #fff;
      border-left: 2px solid #000;
      border-bottom: 2px solid #000;
      z-index: 200;
      display: none;
      flex-direction: column;
      color: #000;
      height: auto; /* 전체 카드 높이 가변 */
    }

    .info-card-panel.active {
      display: flex;
    }

    /* 1. 타이틀 영역 */
    .card-title-row {
      padding: 14px 16px;
      border-bottom: 2px solid #000;
      font-size: 1.35rem;
      font-weight: 400;
      letter-spacing: -0.025em;
      line-height: 1.1;
    }

    /* 2. 중간 구역 (고정 height 제거, min-height 적용으로 절대 안 잘림) */
    .card-middle-row {
      display: flex;
      border-bottom: 2px solid #000;
      min-height: 160px;
      height: auto;
    }

    /* 이미지 박스 */
    .card-image-box {
      width: 150px; /* 이미지 영역 너비 고정 */
      flex-shrink: 0;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 2px solid #000;
      background-color: #fff;
    }

    .card-image-box img {
      max-width: 100%;
      max-height: 130px;
      object-fit: contain;
    }

    /* Material 영역 (가로 공간 충분히 확보) */
    .card-materials-box {
      flex: 1; /* 나머지 모든 가로 공간 차지 */
      padding: 14px 14px;
      font-size: 1.05rem;
      font-weight: 400;
      line-height: 1.3;
      color: #000;
      letter-spacing: -0.015em;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .material-item {
      white-space: nowrap; /* 단어가 임의로 줄바꿈되어 쪼개지는 현상 방지 */
    }

    /* 3. Description */
    .card-description-row {
      padding: 14px 16px;
      font-size: 1.05rem;
      font-weight: 400;
      line-height: 1.3;
      color: #000;
      letter-spacing: -0.015em;
    }

    @media (max-width: 768px) {
      .info-card-panel {
        width: 100vw;
        top: auto;
        bottom: 0;
        border-left: none;
        border-top: 2px solid #000;
      }
      .card-title-row { font-size: 1.2rem; }
      .card-materials-box,
      .card-description-row { font-size: 0.95rem; }
    }
  </style>

  <!-- Google Maps JavaScript API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAM5AYPSJ3qDDdhUjPpZg4RqiaM-2en7y4"></script>
</head>
<body>

  <a href="index.html" class="home-btn">Home</a>
  <div id="street-view"></div>

  <!-- 우측 상단 스티커 정보 카드 팝업 -->
  <div class="info-card-panel" id="infoCard">
    <div class="card-title-row" id="cardTitle">Title</div>
    <div class="card-middle-row">
      <div class="card-image-box">
        <img id="cardImage" src="" alt="Sticker Preview">
      </div>
      <div class="card-materials-box" id="cardMaterials">Materials</div>
    </div>
    <div class="card-description-row" id="cardDescription">
      An object found on the streets of New York City, capturing a moment of urban decay.
    </div>
  </div>

  <script>
    const stickerData = {
      "threenine_trash.png": {
        title: "3 for $9",
        materials: ["newsprint paper", "plastic trash bag", "ink"]
      },
      "melon_trash.png": {
        title: "Perishing Flesh",
        materials: ["melon rind", "seeds", "plastic shopping bag", "aluminum can"]
      },
      "snapple_trash.png": {
        title: "Crushed Vessel",
        materials: ["plastic beverage bottle", "vinyl", "paper label"]
      },
      "pigeon_trash.png": {
        title: "Urban Sanctuary",
        materials: ["feathers", "organic specimen"]
      },
      "gloves_trash.png": {
        title: "High-Fives, No Hands",
        materials: ["cotton", "latex", "nylon"]
      },
      "cone_trash.png": {
        title: "Cone-tastrophe!",
        materials: ["plastic", "rubber", "water", "concrete"]
      },
      "flour_trash.png": {
        title: "Spilled White on Iron",
        materials: ["cast iron", "steel", "powder", "paper", "concrete"]
      },
      "paperbag_trash.png": {
        title: "Crumpled Kraft",
        materials: ["light brown crumpled paper bag", "ink"]
      },
      "redbag_trash.png": {
        title: "Crimson Takeout",
        materials: ["red plastic bag", "paper box", "food residue", "vinyl"]
      },
      "orangebox_trash.png": {
        title: "Bound Memory of Commerce",
        materials: ["cardboard", "paper box", "plastic twine", "ink"]
      },
      "can_trash.png": {
        title: "Metallic Echoes",
        materials: ["aluminum cans", "metal lids", "printed ink"]
      },
      "sweater_trash.png": {
        title: "Abandoned Fabric and Flora",
        materials: ["cotton", "polyester", "organic matter"]
      },
      "cvs_trash.png": {
        title: "Paper Heart",
        materials: ["paper shopping bag", "steel", "cast iron", "wood"]
      },
      "scrapwood_trash.png": {
        title: "Jenga: Hardcore Edition",
        materials: ["scrap wood", "plastic", "vinyl", "rubber", "steel"]
      },
      "fence_trash.png": {
        title: "Do Not Cross",
        materials: ["galvanized steel", "yellow caution tape", "vinyl", "plastic"]
      },
      "waterpipe_trash.png": {
        title: "Shattered Flow",
        materials: ["cast iron", "paint", "water", "concrete", "asphalt"]
      },
      "boxes_trash.png": {
        title: "Compressed Strata",
        materials: ["cardboard", "pulp molded tray", "steel", "twine"]
      },
      "trashcan_trash.png": {
        title: "Sugary Chaos Bouquet",
        materials: ["paper", "plastic", "vinyl", "aluminum", "food waste"]
      },
      "yellowbag_trash.png": {
        title: "Clear Heap",
        materials: ["plastic trash bags", "polystyrene foam", "plastic", "aluminum can"]
      },
      "newspaper_trash.png": {
        title: "One Angry Juror",
        materials: ["newsprint paper", "rubber band", "string", "paper coffee cup", "plastic lid"]
      },
      "blackbags_trash.png": {
        title: "Dark Volume",
        materials: ["plastic trash bags", "plastic bucket", "cardboard", "mixed waste"]
      },
      "matcha_trash.png": {
        title: "Iced Siren",
        materials: ["plastic cup", "plastic lid", "plastic straw", "matcha residue"]
      },
      "umbrella_trash.png": {
        title: "Blue Shelter",
        materials: ["polyester fabric", "steel", "plastic", "fiberglass"]
      },
      "ruler_trash.png": {
        title: "Abandoned Game",
        materials: ["Wood", "printed paper", "metal", "plastic", "cardboard"]
      }
    };

    const imageFiles = Object.keys(stickerData);
    let activeOverlays = [];
    let currentSelectedImage = null;

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function toggleInfoCard(imgFile) {
      const card = document.getElementById("infoCard");

      if (card.classList.contains("active") && currentSelectedImage === imgFile) {
        closeInfoCard();
        return;
      }

      currentSelectedImage = imgFile;

      const data = stickerData[imgFile] || {
        title: "Urban Artifact",
        materials: ["mixed waste"]
      };

      document.getElementById("cardTitle").textContent = data.title;
      document.getElementById("cardImage").src = `./${imgFile}`;
      
      // 한 줄당 재질 1개 배치 + 마지막 항목만 쉼표 자동 제거
      const formattedMaterials = data.materials
        .map((item, idx) => {
          const isLast = idx === data.materials.length - 1;
          const text = isLast ? item.trim() : `${item.trim()},`;
          return `<div class="material-item">${text}</div>`;
        })
        .join('');

      document.getElementById("cardMaterials").innerHTML = formattedMaterials;

      card.classList.add("active");
    }

    function closeInfoCard() {
      document.getElementById("infoCard").classList.remove("active");
      currentSelectedImage = null;
    }

    class StickerOverlay extends google.maps.OverlayView {
      constructor(position, image, size) {
        super();
        this.position = position;
        this.image = image;
        this.size = size;
        this.div = null;
      }

      onAdd() {
        this.div = document.createElement("div");
        this.div.className = "custom-sticker-overlay";
        const img = document.createElement("img");
        img.src = `./${this.image}`;
        img.style.width = `${this.size}px`;
        this.div.appendChild(img);

        this.div.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleInfoCard(this.image);
        });

        const panes = this.getPanes();
        panes.overlayLayer.appendChild(this.div);
      }

      draw() {
        const overlayProjection = this.getProjection();
        if (!overlayProjection) return;
        const point = overlayProjection.fromLatLngToDivPixel(this.position);
        if (point && this.div) {
          this.div.style.left = point.x + "px";
          this.div.style.top = point.y + "px";
        }
      }

      onRemove() {
        if (this.div) {
          this.div.parentNode.removeChild(this.div);
          this.div = null;
        }
      }
    }

    function clearStickers() {
      activeOverlays.forEach(overlay => overlay.setMap(null));
      activeOverlays = [];
    }

    function spawnNewStickers(panorama) {
      clearStickers();

      const currentPos = panorama.getPosition();
      if (!currentPos) return;

      const lat = currentPos.lat();
      const lng = currentPos.lng();

      const selectedImages = shuffle([...imageFiles]).slice(0, 3);

      const offsets = [
        { dLat: 0.00004 + Math.random() * 0.00003, dLng: 0.00003 + Math.random() * 0.00003 },
        { dLat: -0.00004 - Math.random() * 0.00003, dLng: -0.00003 - Math.random() * 0.00003 },
        { dLat: 0.00005 - Math.random() * 0.00002, dLng: -0.00004 + Math.random() * 0.00002 }
      ];

      selectedImages.forEach((imgFile, index) => {
        const targetLat = lat + offsets[index].dLat;
        const targetLng = lng + offsets[index].dLng;
        const size = Math.floor(Math.random() * 120) + 260;

        const overlay = new StickerOverlay(
          new google.maps.LatLng(targetLat, targetLng),
          imgFile,
          size
        );
        overlay.setMap(panorama);
        activeOverlays.push(overlay);
      });
    }

    function initStreetView() {
      const panoramaPos = { lat: 40.7340891, lng: -73.9831388 };

      const panorama = new google.maps.StreetViewPanorama(
        document.getElementById("street-view"),
        {
          position: panoramaPos,
          pov: { heading: 6.44, pitch: -10 },
          zoom: 1,
          disableDefaultUI: true
        }
      );

      panorama.addListener("click", () => {
        closeInfoCard();
      });

      google.maps.event.addListenerOnce(panorama, 'position_changed', () => {
        spawnNewStickers(panorama);
      });

      panorama.addListener('position_changed', () => {
        spawnNewStickers(panorama);
        closeInfoCard();
      });
    }

    window.onload = initStreetView;
  </script>

</body>
</html>
