<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Urban Mess: - Street View</title>

  <style>
    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Lay Grotesk', sans-serif;
    }

    body, html {
      width: 100vw;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000;
    }

    /* 전체 스트릿 뷰 컨테이너 */
    .streetview-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    /* 구글 스트릿 뷰 iframe 전체 화면 적용 */
    #streetview-iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* 상단 MAP으로 돌아가는 백 버튼 */
    .back-btn {
      position: fixed;
      top: 30px;
      right: 30px;
      z-index: 100;
      background: #ffffff;
      color: #000000;
      border: 1.5px solid #000000;
      padding: 8px 16px;
      font-size: 0.9rem;
      text-decoration: none;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .back-btn:hover {
      background: #000000;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="streetview-wrapper">
    <!-- 뒤로가기 버튼 -->
    <a href="page2.html" class="back-btn">← MAP</a>

    <!-- NYU Langone Orthopedic Hospital 앞 360도 스트릿 뷰 -->
    <iframe 
      id="streetview-iframe"
      src="https://www.google.com/maps/embed?pb=!4v1791904094783!6m8!1m7!1s7aRErwnfiFdqFyJERbfROw!2m2!1d40.73408914393735!2d-73.98313883562084!3f6.437480614722146!4f-39.04986442395682!5f0.7820865974627469" 
      allowfullscreen="" 
      loading="lazy" 
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>

</body>
</html>
