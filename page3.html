<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Urban Mess: - Street View</title>

  <style>
    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: 'Lay Grotesk', sans-serif; 
      font-weight: 400;
    }

    body, html { 
      width: 100vw; 
      height: 100%; 
      height: 100dvh; 
      overflow: hidden; 
      background-color: #000; 
    }

    #street-view {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    /* Home 버튼 */
    .home-btn {
      position: fixed;
      top: 30px;
      right: 30px;
      z-index: 100;
      background: #ffffff;
      color: #000000;
      border: 1.5px solid #000000;
      padding: 8px 16px;
      font-size: 0.9rem;
      text-decoration: none;
    }

    /* 커스텀 오버레이 스티커 스타일 */
    .custom-sticker-overlay {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.5));
      transition: transform 0.15s ease;
    }

    .custom-sticker-overlay:hover {
      transform: translate(-50%, -50%) scale(1.08);
    }

    /* 스티커 정보 카드 팝업 */
    .info-card-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 380px;
      background-color: #fff;
      border-left: 2px solid #000;
      border-bottom: 2px solid #000;
      z-index: 200;
      display: none;
      flex-direction: column;
      color: #000;
    }

    .info-card-panel.active {
      display: flex;
    }

    /* 1. 타이틀 영역 */
    .card-title-row {
      padding: 16px 20px;
      border-bottom: 2px solid #000;
      font-size: 1.8rem;
      font-weight: 400;
      letter-spacing: -0.025em;
      line-height: 1.1;
    }

    /* 2. 중간 구역 */
    .card-middle-row {
      display: flex;
      border-bottom: 2px solid #000;
      min-height: 185px;
      height: auto;
    }

    /* 이미지 박스 */
    .card-image-box {
      flex: 1.25;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 2px solid #000;
      background-color: #fff;
      overflow: hidden; /* 배율 확대로 인한 영역 이탈 방지 */
    }

    .card-image-box img {
      max-width: 90%;
      max-height: 155px;
      object-fit: contain;
      transition: transform 0.2s ease;
    }

    /* Material 영역: 상단 정렬 적용 */
    .card-materials-box {
      flex: 0.95;
      padding: 16px 14px;
      font-size: 1.4rem;
      font-weight: 400;
      line-height: 1.35;
      color: #000;
      letter-spacing: -0.015em;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    /* 3. Description 영역 */
    .card-description-row {
      padding: 20px;
      font-size: 1.4rem;
      font-weight: 400;
      line-height: 1.35;
      color: #000;
      letter-spacing: -0.015em;
    }

    @media (max-width: 768px) {
      .info-card-panel {
        width: 100vw;
        top: auto;
        bottom: 0;
        border-left: none;
        border-top: 2px solid #000;
      }
      .card-title-row { font-size: 1.4rem; }
      .card-materials-box,
      .card-description-row { font-size: 1.1rem; }
    }
  </style>

  <!-- Google Maps JavaScript API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAM5AYPSJ3qDDdhUjPpZg4RqiaM-2en7y4"></script>
</head>
<body>

  <a href="index.html" class="home-btn">Home</a>
  <div id="street-view"></div>

  <!-- 우측 상단 스티커 정보 카드 팝업 -->
  <div class="info-card-panel" id="infoCard">
    <div class="card-title-row" id="cardTitle">Title</div>
    <div class="card-middle-row">
      <div class="card-image-box">
        <img id="cardImage" src="" alt="Sticker Preview">
      </div>
      <div class="card-materials-box" id="cardMaterials">Materials</div>
    </div>
    <div class="card-description-row" id="cardDescription">
      Description
    </div>
  </div>

  <script>
    // 각 스티커 이미지 크기 조정을 위한 scale 매핑 추가
    const stickerData = {
      "threenine_trash.png": {
        title: "3 for $9",
        materials: ["newsprint paper", "plastic trash bag", "ink"],
        description: "A discarded price sign resting beside a tied plastic bag, telling a quiet story of street-side bargains and daily trade.",
        scale: 1.0
      },
      "melon_trash.png": {
        title: "Perishing Flesh",
        materials: ["melon rind", "seeds", "plastic shopping bag", "aluminum can"],
        description: "A hollowed-out melon rind lying beside a plastic shopping bag, a rare organic fragment on the hard city concrete.",
        scale: 3.0 // 3배 확대
      },
      "snapple_trash.png": {
        title: "Crushed Vessel",
        materials: ["plastic beverage bottle", "vinyl", "paper label"],
        description: "A flattened plastic juice bottle resting on the concrete, reflecting the quick, disposable rhythm of street life.",
        scale: 3.2 // 3.2배 확대
      },
      "pigeon_trash.png": {
        title: "Urban Sanctuary",
        materials: ["feathers", "organic specimen"],
        description: "A calm pigeon nestled quietly on the sidewalk, finding a moment of rest amidst the relentless city rush.",
        scale: 3.0 // 3배 확대
      },
      "gloves_trash.png": {
        title: "High-Fives, No Hands",
        materials: ["cotton", "latex", "nylon"],
        description: "Worn-out pink work gloves scattered on the pavement, resting after a long day of unseen urban labor.",
        scale: 3.2 // 3.2배 확대
      },
      "cone_trash.png": {
        title: "Cone-tastrophe!",
        materials: ["plastic", "rubber", "water", "concrete"],
        description: "A battered traffic cone knocked sideways on wet asphalt, marking a brief moment of chaos in the city grid.",
        scale: 1.0
      },
      "flour_trash.png": {
        title: "Spilled White on Iron",
        materials: ["cast iron", "steel", "powder", "paper", "concrete"],
        description: "An old fire hydrant coated in dried white paint splatter, standing as a quiet monument to street-level wear and tear.",
        scale: 1.0
      },
      "paperbag_trash.png": {
        title: "Crumpled Kraft",
        materials: ["light brown crumpled paper bag", "ink"],
        description: "A heavily creased brown paper bag sitting alone on the ground, holding the forgotten warmth of a past errand.",
        scale: 3.5 // 3.5배 확대
      },
      "redbag_trash.png": {
        title: "Crimson Takeout",
        materials: ["red plastic bag", "paper box", "food residue", "vinyl"],
        description: "A bright red takeout bag and crushed cardboard box left on the sidewalk, the colorful traces of a quick late-night meal.",
        scale: 1.0
      },
      "orangebox_trash.png": {
        title: "Bound Memory of Commerce",
        materials: ["cardboard", "paper box", "plastic twine", "ink"],
        description: "A neat stack of crushed cardboard boxes tied with twine, waiting on the curb at the end of a busy business day.",
        scale: 3.0 // 3배 확대
      },
      "can_trash.png": {
        title: "Metallic Echoes",
        materials: ["aluminum cans", "metal lids", "printed ink"],
        description: "Crushed aluminum cans and lids scattered on the pavement, glowing subtly under the streetlights.",
        scale: 3.2 // 3.2배 확대
      },
      "sweater_trash.png": {
        title: "Abandoned Fabric and Flora",
        materials: ["cotton", "polyester", "organic matter"],
        description: "A forgotten navy hoodie lying next to a stray patch of weeds, bridging the gap between human wear and urban nature.",
        scale: 1.0
      },
      "cvs_trash.png": {
        title: "Paper Heart",
        materials: ["paper shopping bag", "steel", "cast iron", "wood"],
        description: "A crinkled brown paper bag with a red recycling symbol hanging off a rusty metal beam, a brief sign of life in the alley.",
        scale: 1.0
      },
      "scrapwood_trash.png": {
        title: "Jenga: Hardcore Edition",
        materials: ["scrap wood", "plastic", "vinyl", "rubber", "steel"],
        description: "A messy pile of discarded timber and tool buckets left on the curb, a raw footprint of constant urban transformation.",
        scale: 1.0
      },
      "fence_trash.png": {
        title: "Do Not Cross",
        materials: ["galvanized steel", "yellow caution tape", "vinyl", "plastic"],
        description: "Galvanized steel barricades wrapped in yellow caution tape, quietly directing the flow of crowd and urban movement.",
        scale: 1.0
      },
      "waterpipe_trash.png": {
        title: "Shattered Flow",
        materials: ["cast iron", "paint", "water", "concrete", "asphalt"],
        description: "A sleek fire hydrant standing over a dark, glistening puddle on the asphalt, capturing the city’s quiet rainy moments.",
        scale: 1.0
      },
      "boxes_trash.png": {
        title: "Compressed Strata",
        materials: ["cardboard", "pulp molded tray", "steel", "twine"],
        description: "Stacked cardboard and egg cartons tightly bound together, carrying the heavy layers of daily city consumption.",
        scale: 1.0
      },
      "trashcan_trash.png": {
        title: "Sugary Chaos Bouquet",
        materials: ["paper", "plastic", "vinyl", "aluminum", "food waste"],
        description: "A trash can overflowing with colorful coffee cups and plastic straws, a sweet remnant of New York's daily caffeine fix.",
        scale: 1.0
      },
      "yellowbag_trash.png": {
        title: "Clear Heap",
        materials: ["plastic trash bags", "polystyrene foam", "plastic", "aluminum can"],
        description: "A pile of translucent trash bags revealing glimpses of daily waste, catching the soft reflections of city light.",
        scale: 1.0
      },
      "newspaper_trash.png": {
        title: "One Angry Juror",
        materials: ["newsprint paper", "rubber band", "string", "paper coffee cup", "plastic lid"],
        description: "A bundle of discarded newspapers tied together next to a paper coffee cup, leaving yesterday's news behind on the curb.",
        scale: 3.2 // 3.2배 확대
      },
      "blackbags_trash.png": {
        title: "Dark Volume",
        materials: ["plastic trash bags", "plastic bucket", "cardboard", "mixed waste"],
        description: "Heavy black trash bags piled together on the curb, forming a dark silhouette in the quiet city night.",
        scale: 1.0
      },
      "matcha_trash.png": {
        title: "Iced Siren",
        materials: ["plastic cup", "plastic lid", "plastic straw", "matcha residue"],
        description: "An abandoned iced matcha cup with melting condensation, a snapshot of a fleeting coffee break on the go.",
        scale: 3.2 // 3.2배 확대
      },
      "umbrella_trash.png": {
        title: "Blue Shelter",
        materials: ["polyester fabric", "steel", "plastic", "fiberglass"],
        description: "A blue umbrella resting wide open on the sidewalk, left behind after a sudden New York downpour.",
        scale: 2.8 // 2.8배 확대
      },
      "ruler_trash.png": {
        title: "Abandoned Game",
        materials: ["Wood", "printed paper", "metal", "plastic", "cardboard"],
        description: "A broken wooden game board tossed onto the sidewalk, a forgotten piece of late-night street entertainment.",
        scale: 3.0 // 3배 확대
      }
    };

    const imageFiles = Object.keys(stickerData);
    let activeOverlays = [];
    let currentSelectedImage = null;

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function toggleInfoCard(imgFile) {
      const card = document.getElementById("infoCard");

      if (card.classList.contains("active") && currentSelectedImage === imgFile) {
        closeInfoCard();
        return;
      }

      currentSelectedImage = imgFile;

      const data = stickerData[imgFile] || {
        title: "Urban Artifact",
        materials: ["mixed waste"],
        description: "An object found on the streets of New York City, capturing a moment of urban decay.",
        scale: 1.0
      };

      document.getElementById("cardTitle").textContent = data.title;
      
      const cardImg = document.getElementById("cardImage");
      cardImg.src = `./${imgFile}`;
      // 이미지별 개별 scale 변환 적용
      cardImg.style.transform = `scale(${data.scale || 1.0})`;

      document.getElementById("cardDescription").textContent = data.description;
      
      const rawMaterials = Array.isArray(data.materials) ? data.materials : [data.materials];
      const formattedMaterials = rawMaterials
        .map((item, idx) => {
          const cleanItem = String(item).trim().replace(/,$/, '');
          return idx === rawMaterials.length - 1 ? cleanItem : `${cleanItem},`;
        })
        .join('<br>');

      document.getElementById("cardMaterials").innerHTML = formattedMaterials;

      card.classList.add("active");
    }

    function closeInfoCard() {
      document.getElementById("infoCard").classList.remove("active");
      currentSelectedImage = null;
    }

    class StickerOverlay extends google.maps.OverlayView {
      constructor(position, image, size) {
        super();
        this.position = position;
        this.image = image;
        this.size = size;
        this.div = null;
      }

      onAdd() {
        this.div = document.createElement("div");
        this.div.className = "custom-sticker-overlay";
        const img = document.createElement("img");
        img.src = `./${this.image}`;
        img.style.width = `${this.size}px`;
        this.div.appendChild(img);

        this.div.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleInfoCard(this.image);
        });

        const panes = this.getPanes();
        panes.overlayLayer.appendChild(this.div);
      }

      draw() {
        const overlayProjection = this.getProjection();
        if (!overlayProjection) return;
        const point = overlayProjection.fromLatLngToDivPixel(this.position);
        if (point && this.div) {
          this.div.style.left = point.x + "px";
          this.div.style.top = point.y + "px";
        }
      }

      onRemove() {
        if (this.div) {
          this.div.parentNode.removeChild(this.div);
          this.div = null;
        }
      }
    }

    function clearStickers() {
      activeOverlays.forEach(overlay => overlay.setMap(null));
      activeOverlays = [];
    }

    function spawnNewStickers(panorama) {
      clearStickers();

      const currentPos = panorama.getPosition();
      if (!currentPos) return;

      const lat = currentPos.lat();
      const lng = currentPos.lng();

      const selectedImages = shuffle([...imageFiles]).slice(0, 3);

      const offsets = [
        { dLat: 0.00004 + Math.random() * 0.00003, dLng: 0.00003 + Math.random() * 0.00003 },
        { dLat: -0.00004 - Math.random() * 0.00003, dLng: -0.00003 - Math.random() * 0.00003 },
        { dLat: 0.00005 - Math.random() * 0.00002, dLng: -0.00004 + Math.random() * 0.00002 }
      ];

      selectedImages.forEach((imgFile, index) => {
        const targetLat = lat + offsets[index].dLat;
        const targetLng = lng + offsets[index].dLng;
        const size = Math.floor(Math.random() * 120) + 260;

        const overlay = new StickerOverlay(
          new google.maps.LatLng(targetLat, targetLng),
          imgFile,
          size
        );
        overlay.setMap(panorama);
        activeOverlays.push(overlay);
      });
    }

    function initStreetView() {
      const panoramaPos = { lat: 40.7340891, lng: -73.9831388 };

      const panorama = new google.maps.StreetViewPanorama(
        document.getElementById("street-view"),
        {
          position: panoramaPos,
          pov: { heading: 6.44, pitch: -10 },
          zoom: 1,
          disableDefaultUI: true
        }
      );

      panorama.addListener("click", () => {
        closeInfoCard();
      });

      google.maps.event.addListenerOnce(panorama, 'position_changed', () => {
        spawnNewStickers(panorama);
      });

      panorama.addListener('position_changed', () => {
        spawnNewStickers(panorama);
        closeInfoCard();
      });
    }

    window.onload = initStreetView;
  </script>

</body>
</html>
