<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Urban Mess: - 360 Exhibition</title>

  <!-- Pannellum 360 라이브러리 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <style>
    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Medium.ttf') format('truetype');
      font-weight: 500;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Lay Grotesk', sans-serif;
    }

    body, html {
      width: 100vw;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000;
    }

    #panorama {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    /* HOME 버튼 */
    .home-btn {
      position: fixed;
      top: 30px;
      right: 30px;
      z-index: 100;
      background: #ffffff;
      color: #000000;
      border: 1.5px solid #000000;
      padding: 8px 16px;
      font-size: 0.9rem;
      text-decoration: none;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .home-btn:hover {
      background: #000000;
      color: #ffffff;
    }

    /* 360도 공간 내 스티커 커스텀 스타일 (크기 확대) */
    .pnm-sticker {
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <a href="index.html" class="home-btn">HOME</a>
  <div id="panorama"></div>

  <script>
    // 루트 경로의 24개 이미지 리스트
    const imageFiles = [
      "threenine_trash.png", "melon_trash.png", "snapple_trash.png", "pigeon_trash.png", 
      "gloves_trash.png", "cone_trash.png", "flour_trash.png", "paperbag_trash.png", 
      "redbag_trash.png", "orangebox_trash.png", "can_trash.png", "sweater_trash.png", 
      "cvs_trash.png", "scrapwood_trash.png", "fence_trash.png", "waterpipe_trash.png", 
      "boxes_trash.png", "trashcan_trash.png", "yellowbag_trash.png", "newspaper_trash.png", 
      "blackbags_trash.png", "matcha_trash.png", "umbrella_trash.png", "ruler_trash.png"
    ];

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    // 1. 랜덤하게 3개 이미지 선택
    const selectedImages = shuffle([...imageFiles]).slice(0, 3);

    // 2. 공간 상에 배치할 핫스팟 좌표 설정 (위도 pitch, 경도 yaw)
    // 겹치지 않도록 구역을 무작위 지정
    const predefinedPositions = shuffle([
      { pitch: -10, yaw: -30 },
      { pitch: -5, yaw: 15 },
      { pitch: -15, yaw: 60 },
      { pitch: 0, yaw: -80 },
      { pitch: -20, yaw: 110 }
    ]);

    // Pannellum에 전달할 Hotspot 생성
    const customHotspots = selectedImages.map((filename, index) => {
      const pos = predefinedPositions[index];
      
      // 첨부 이미지처럼 크게 나오도록 스케일 커스텀 (200px ~ 380px 사이 랜덤)
      const width = Math.floor(Math.random() * 180) + 200; 
      const height = Math.floor(width * 1.2);

      return {
        "pitch": pos.pitch,
        "yaw": pos.yaw,
        "cssClass": `pnm-sticker sticker-${index}`,
        "createTooltipFunc": function(hotSpotDiv) {
          hotSpotDiv.style.width = `${width}px`;
          hotSpotDiv.style.height = `${height}px`;
          hotSpotDiv.style.backgroundImage = `url('./${filename}')`;
        }
      };
    });

    // 360도 뷰어 초기화
    pannellum.viewer('panorama', {
      "type": "equirectangular",
      "panorama": "https://pannellum.org/images/alma.jpg", // 360도 파노라마 배경 (원하시는 배경 이미지 주소로 교체 가능)
      "autoLoad": true,
      "showControls": false,
      "hotSpots": customHotspots
    });
  </script>

</body>
</html>
