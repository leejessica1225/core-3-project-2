<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Urban Mess: - Street View</title>

  <style>
    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: 'Lay Grotesk', sans-serif; 
      font-weight: 400;
    }

    body, html { 
      width: 100vw; 
      height: 100%; 
      height: 100dvh; 
      overflow: hidden; 
      background-color: #000; 
    }

    #street-view {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    /* HOME 버튼 */
    .home-btn {
      position: fixed;
      top: 30px;
      right: 30px;
      z-index: 100;
      background: #ffffff;
      color: #000000;
      border: 1.5px solid #000000;
      padding: 8px 16px;
      font-size: 0.9rem;
      text-decoration: none;
    }

    /* 커스텀 오버레이 스티커 스타일 */
    .custom-sticker-overlay {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.5));
      transition: transform 0.15s ease;
    }

    .custom-sticker-overlay:hover {
      transform: translate(-50%, -50%) scale(1.08);
    }

    /* 스티커 정보 카드 팝업 (너비 380px 원복) */
    .info-card-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 380px; /* 원래 아까 크기로 복원 */
      background-color: #fff;
      border-left: 2px solid #000;
      border-bottom: 2px solid #000;
      z-index: 200;
      display: none;
      flex-direction: column;
      color: #000;
    }

    .info-card-panel.active {
      display: flex;
    }

    /* 1. 타이틀 (Figma 36px 비율 -> 1.8rem) */
    .card-title-row {
      padding: 16px 20px;
      border-bottom: 2px solid #000;
      font-size: 1.8rem;
      font-weight: 400;
      letter-spacing: -0.025em;
      line-height: 1.1;
    }

    /* 2. 중간 구역 (높이 180px 원복) */
    .card-middle-row {
      display: flex;
      border-bottom: 2px solid #000;
      min-height: 180px; /* 원래 높이로 복원 */
    }

    .card-image-box {
      flex: 1.2;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 2px solid #000;
      background-color: #fff;
    }

    .card-image-box img {
      width: 95%;
      height: 95%;
      object-fit: contain;
    }

    /* Material: 한 줄에 하나씩 표기 (Figma 28px 비율 -> 1.4rem) */
    .card-materials-box {
      flex: 0.8;
      padding: 14px 12px;
      font-size: 1.4rem;
      font-weight: 400;
      line-height: 1.3;
      color: #000;
      word-break: break-word;
      letter-spacing: -0.015em;
    }

    /* 3. Description (Figma 28px 비율 -> 1.4rem) */
    .card-description-row {
      padding: 18px 20px;
      font-size: 1.4rem;
      font-weight: 400;
      line-height: 1.35;
      color: #000;
      letter-spacing: -0.015em;
    }

    @media (max-width: 768px) {
      .info-card-panel {
        width: 100vw;
        top: auto;
        bottom: 0;
        border-left: none;
        border-top: 2px solid #000;
      }
      .card-title-row { font-size: 1.4rem; }
      .card-materials-box,
      .card-description-row { font-size: 1.1rem; }
    }
  </style>

  <!-- Google Maps JavaScript API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAM5AYPSJ3qDDdhUjPpZg4RqiaM-2en7y4"></script>
</head>
<body>

  <a href="index.html" class="home-btn">HOME</a>
  <div id="street-view"></div>

  <!-- 우측 상단 스티커 정보 카드 팝업 -->
  <div class="info-card-panel" id="infoCard">
    <div class="card-title-row" id="cardTitle">
      Cone-tastrophe!
    </div>
    <div class="card-middle-row">
      <div class="card-image-box">
        <img id="cardImage" src="./cone_trash.png" alt="Sticker Preview">
      </div>
      <div class="card-materials-box" id="cardMaterials">
        plastic,<br>rubber,<br>water,<br>concrete
      </div>
    </div>
    <div class="card-description-row" id="cardDescription">
      description blah blah blah Lorem ipsum dolor sit amet.
    </div>
  </div>

  <script>
    const stickerData = {
      "cone_trash.png": {
        title: "Cone-tastrophe!",
        materials: "plastic,<br>rubber,<br>water,<br>concrete",
        description: "description blah blah blah Lorem ipsum dolor sit amet, consectetur adipiscing elit."
      },
      "pigeon_trash.png": {
        title: "Urban Pigeon",
        materials: "organic matter,<br>feathers,<br>beak",
        description: "A familiar winged resident navigating the pavement of New York City."
      },
      "matcha_trash.png": {
        title: "Iced Matcha Cup",
        materials: "plastic,<br>straw,<br>liquid waste,<br>ice",
        description: "A half-empty clear plastic coffee cup abandoned on the sidewalk, reflecting daily coffee culture."
      },
      "cvs_trash.png": {
        title: "Discarded Bag",
        materials: "plastic,<br>vinyl,<br>paper",
        description: "Found plastic bag crumpled near Broadway curb."
      }
    };

    const imageFiles = [
      "threenine_trash.png", "melon_trash.png", "snapple_trash.png", "pigeon_trash.png", 
      "gloves_trash.png", "cone_trash.png", "flour_trash.png", "paperbag_trash.png", 
      "redbag_trash.png", "orangebox_trash.png", "can_trash.png", "sweater_trash.png", 
      "cvs_trash.png", "scrapwood_trash.png", "fence_trash.png", "waterpipe_trash.png", 
      "boxes_trash.png", "trashcan_trash.png", "yellowbag_trash.png", "newspaper_trash.png", 
      "blackbags_trash.png", "matcha_trash.png", "umbrella_trash.png", "ruler_trash.png"
    ];

    let activeOverlays = [];
    let currentSelectedImage = null;

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function toggleInfoCard(imgFile) {
      const card = document.getElementById("infoCard");

      if (card.classList.contains("active") && currentSelectedImage === imgFile) {
        closeInfoCard();
        return;
      }

      currentSelectedImage = imgFile;

      const data = stickerData[imgFile] || {
        title: imgFile.replace('_trash.png', '').replace('_', ' ').toUpperCase(),
        materials: "plastic,<br>paper,<br>mixed waste",
        description: "An object found on the streets of New York City, capturing a moment of urban decay."
      };

      document.getElementById("cardTitle").textContent = data.title;
      document.getElementById("cardImage").src = `./${imgFile}`;
      
      let formattedMaterials = data.materials;
      if (!formattedMaterials.includes('<br>')) {
        formattedMaterials = formattedMaterials.split(',').map(m => m.trim() + ',').join('<br>');
      }
      
      document.getElementById("cardMaterials").innerHTML = formattedMaterials;
      document.getElementById("cardDescription").textContent = data.description;

      card.classList.add("active");
    }

    function closeInfoCard() {
      document.getElementById("infoCard").classList.remove("active");
      currentSelectedImage = null;
    }

    class StickerOverlay extends google.maps.OverlayView {
      constructor(position, image, size) {
        super();
        this.position = position;
        this.image = image;
        this.size = size;
        this.div = null;
      }

      onAdd() {
        this.div = document.createElement("div");
        this.div.className = "custom-sticker-overlay";
        const img = document.createElement("img");
        img.src = `./${this.image}`;
        img.style.width = `${this.size}px`;
        this.div.appendChild(img);

        this.div.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleInfoCard(this.image);
        });

        const panes = this.getPanes();
        panes.overlayLayer.appendChild(this.div);
      }

      draw() {
        const overlayProjection = this.getProjection();
        if (!overlayProjection) return;
        const point = overlayProjection.fromLatLngToDivPixel(this.position);
        if (point && this.div) {
          this.div.style.left = point.x + "px";
          this.div.style.top = point.y + "px";
        }
      }

      onRemove() {
        if (this.div) {
          this.div.parentNode.removeChild(this.div);
          this.div = null;
        }
      }
    }

    function clearStickers() {
      activeOverlays.forEach(overlay => overlay.setMap(null));
      activeOverlays = [];
    }

    function spawnNewStickers(panorama) {
      clearStickers();

      const currentPos = panorama.getPosition();
      if (!currentPos) return;

      const lat = currentPos.lat();
      const lng = currentPos.lng();

      const selectedImages = shuffle([...imageFiles]).slice(0, 3);

      const offsets = [
        { dLat: 0.00004 + Math.random() * 0.00003, dLng: 0.00003 + Math.random() * 0.00003 },
        { dLat: -0.00004 - Math.random() * 0.00003, dLng: -0.00003 - Math.random() * 0.00003 },
        { dLat: 0.00005 - Math.random() * 0.00002, dLng: -0.00004 + Math.random() * 0.00002 }
      ];

      selectedImages.forEach((imgFile, index) => {
        const targetLat = lat + offsets[index].dLat;
        const targetLng = lng + offsets[index].dLng;
        const size = Math.floor(Math.random() * 120) + 260;

        const overlay = new StickerOverlay(
          new google.maps.LatLng(targetLat, targetLng),
          imgFile,
          size
        );
        overlay.setMap(panorama);
        activeOverlays.push(overlay);
      });
    }

    function initStreetView() {
      const panoramaPos = { lat: 40.7340891, lng: -73.9831388 };

      const panorama = new google.maps.StreetViewPanorama(
        document.getElementById("street-view"),
        {
          position: panoramaPos,
          pov: { heading: 6.44, pitch: -10 },
          zoom: 1,
          disableDefaultUI: true
        }
      );

      panorama.addListener("click", () => {
        closeInfoCard();
      });

      google.maps.event.addListenerOnce(panorama, 'position_changed', () => {
        spawnNewStickers(panorama);
      });

      panorama.addListener('position_changed', () => {
        spawnNewStickers(panorama);
        closeInfoCard();
      });
    }

    window.onload = initStreetView;
  </script>

</body>
</html>
