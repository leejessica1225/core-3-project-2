<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Urban Mess: - Street View</title>

  <style>
    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Lay Grotesk', sans-serif;
    }

    body, html {
      width: 100vw;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000;
    }

    .streetview-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      cursor: grab;
    }

    .streetview-wrapper:active {
      cursor: grabbing;
    }

    #streetview-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: auto;
    }

    /* HOME 버튼 */
    .home-btn {
      position: fixed;
      top: 30px;
      right: 30px;
      z-index: 100;
      background: #ffffff;
      color: #000000;
      border: 1.5px solid #000000;
      padding: 8px 16px;
      font-size: 0.9rem;
      text-decoration: none;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .home-btn:hover {
      background: #000000;
      color: #ffffff;
    }

    /* 스티커 레이어 */
    #sticker-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none; /* 지도의 마우스 드래그가 동작하도록 통과 */
      overflow: hidden;
    }

    .sticker {
      position: absolute;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.45));
      user-select: none;
      will-change: transform;
    }
  </style>
</head>
<body>

  <div class="streetview-wrapper" id="viewWrapper">
    <a href="index.html" class="home-btn">HOME</a>

    <!-- NYU Langone / 301 Residence Hall 앞 360도 스트릿 뷰 -->
    <iframe 
      id="streetview-iframe"
      src="https://www.google.com/maps/embed?pb=!4v1791904094783!6m8!1m7!1s7aRErwnfiFdqFyJERbfROw!2m2!1d40.73408914393735!2d-73.98313883562084!3f6.437480614722146!4f-39.04986442395682!5f0.7820865974627469" 
      allowfullscreen="" 
      loading="lazy" 
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <div id="sticker-container"></div>
  </div>

  <script>
    const imageFiles = [
      "threenine_trash.png", "melon_trash.png", "snapple_trash.png", "pigeon_trash.png", 
      "gloves_trash.png", "cone_trash.png", "flour_trash.png", "paperbag_trash.png", 
      "redbag_trash.png", "orangebox_trash.png", "can_trash.png", "sweater_trash.png", 
      "cvs_trash.png", "scrapwood_trash.png", "fence_trash.png", "waterpipe_trash.png", 
      "boxes_trash.png", "trashcan_trash.png", "yellowbag_trash.png", "newspaper_trash.png", 
      "blackbags_trash.png", "matcha_trash.png", "umbrella_trash.png", "ruler_trash.png"
    ];

    const container = document.getElementById('sticker-container');
    const wrapper = document.getElementById('viewWrapper');
    const STICKER_COUNT = 3; // 3개만 표시

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    let isDragging = false;
    let startX = 0;
    let currentRotationX = 0;
    const stickerElements = [];

    function generateStickers() {
      const selectedImages = shuffle([...imageFiles]).slice(0, STICKER_COUNT);
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;

      selectedImages.forEach((filename, index) => {
        const img = document.createElement('img');
        img.classList.add('sticker');

        img.onload = function() {
          // 크기를 사진처럼 거대하게 설정 (220px ~ 380px 사이)
          const size = Math.floor(Math.random() * 160) + 220;
          img.style.width = `${size}px`;

          // 초기 좌/우/상/하 위치 분산
          let initialLeft = (screenWidth / 3) * index + Math.random() * 80;
          let initialTop = Math.floor(Math.random() * (screenHeight - size - 160)) + 80;

          img.dataset.baseLeft = initialLeft;
          img.style.left = `${initialLeft}px`;
          img.style.top = `${initialTop}px`;

          container.appendChild(img);
          stickerElements.push({
            element: img,
            baseLeft: initialLeft
          });
        };

        img.src = `./${filename}`;
      });
    }

    // --------------------------------------------------
    // 마우스 드래그 회전 시 스티커를 맵 상에 고정된 것처럼 이동시키는 인터랙션
    // --------------------------------------------------
    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      
      const deltaX = e.clientX - startX;
      startX = e.clientX;
      currentRotationX += deltaX;

      // 지도를 돌리는 방향과 연동하여 스티커 수평 위치 이동
      stickerElements.forEach(item => {
        const newLeft = item.baseLeft + currentRotationX;
        item.element.style.left = `${newLeft}px`;
      });
    });

    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mouseleave', () => { isDragging = false; });

    generateStickers();
  </script>

</body>
</html>
