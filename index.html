<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Mess: - 메인</title>
  <style>
    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Lay Grotesk', sans-serif;
      font-weight: 400;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fff;
    }

    .container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      border: 3px solid #000;
    }

    .header {
      padding: 18px 24px;
      border-bottom: 3px solid #000;
    }

    .header h1 {
      font-size: 7.5vw;
      line-height: 0.9;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .map-container {
      flex: 1;
      background-color: #d8d8d8;
      position: relative;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s cubic-bezier(0.25, 1, 0.5, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
    }

    .click-text {
      font-size: 3.5rem;
      color: #333;
      opacity: 0;
      transition: opacity 0.3s ease;
      user-select: none;
      font-weight: 400;
    }

    .map-container:hover {
      opacity: 0.75;
    }

    .map-container:hover .click-text {
      opacity: 1;
    }

    .map-container.expanding {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      opacity: 1;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      transform: scale(1);
    }

    .footer {
      padding: 18px 24px;
      border-top: 3px solid #000;
    }

    .footer p {
      font-size: 4.8vw;
      line-height: 1;
      font-weight: 400;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Urban Mess:</h1>
    </div>

    <div class="map-container" id="mapBox">
      <span class="click-text">click</span>
    </div>

    <div class="footer">
      <p>An Exhibition of Things We Throw Away</p>
    </div>
  </div>

  <script>
    const mapBox = document.getElementById('mapBox');

    mapBox.addEventListener('click', function() {
      const rect = mapBox.getBoundingClientRect();
      
      mapBox.style.position = 'fixed';
      mapBox.style.top = rect.top + 'px';
      mapBox.style.left = rect.left + 'px';
      mapBox.style.width = rect.width + 'px';
      mapBox.style.height = rect.height + 'px';

      requestAnimationFrame(() => {
        mapBox.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
        mapBox.style.top = '0px';
        mapBox.style.left = '0px';
        mapBox.style.width = '100vw';
        mapBox.style.height = '100vh';
      });

      setTimeout(() => {
        window.location.href = 'page2.html';
      }, 500);
    });
  </script>

</body>
</html>
