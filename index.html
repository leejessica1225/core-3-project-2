<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Mess: - 메인</title>
  <style>
    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Lay Grotesk', sans-serif;
      font-weight: 400;
    }

    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #fff;
    }

    .container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100%;
      height: 100dvh;
      position: relative;
    }

    .header {
      padding: 14px 20px;
      border-bottom: 2px solid #000;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
    }

    .header h1 {
      font-size: 8.8vw;
      line-height: 0.92;
      font-weight: 500;
      letter-spacing: -0.025em;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      padding-top: 6px;
    }

    .nav-menu a {
      text-decoration: none;
      color: #000;
      font-size: 1.8vw;
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    .nav-menu a:hover {
      opacity: 0.6;
    }

    .map-container {
      flex: 1;
      background-color: #d3d3d3;
      position: relative;
      overflow: hidden;
    }

    /* 하단 회색 여백을 완벽하게 화면 밖으로 밀어내기 위해 높이 및 상단 위치 재조정 */
    .map-wrapper {
      position: absolute;
      top: -30px;
      left: 0;
      width: calc(100% + 55px);
      height: calc(100% + 110px);
    }

    .map-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .footer {
      padding: 14px 20px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      border-top: 2px solid #000;
      z-index: 10;
    }

    .footer p {
      font-size: 4.2vw;
      line-height: 1.1;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .gray-expand-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background-color: #d3d3d3;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transition: clip-path 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .gray-expand-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 768px) {
      .nav-menu a {
        font-size: 3.5vw;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Urban Mess:</h1>
      <nav class="nav-menu">
        <a href="about.html">About</a>
        <a href="text.html">Text</a>
        <a href="catalog.html">Catalog</a>
      </nav>
    </div>

    <div class="map-container" id="mapBox">
      <div class="map-wrapper">
        <iframe src="https://api.mapbox.com/styles/v1/leejessica1225/cmv06jab0005001s1fd8e551k.html?title=view&access_token=pk.eyJ1IjoibGVlamVzc2ljYTEyMjUiLCJhIjoiY212MDBlY3djMDEwNzJ5cHlmcm4ydTY5biJ9._rFqHdB2lQ_6yt18e02VkQ&zoomwheel=true&fresh=true#13.56/40.73108/-73.99013"></iframe>
      </div>
    </div>

    <div class="footer">
      <p>An Exhibition of Things We Throw Away</p>
    </div>
  </div>

  <div class="gray-expand-overlay" id="expandOverlay"></div>

  <script>
    const mapBox = document.getElementById('mapBox');
    const expandOverlay = document.getElementById('expandOverlay');

    function triggerTransition() {
      const rect = mapBox.getBoundingClientRect();
      const winW = window.innerWidth;
      const winH = window.innerHeight;

      const top = rect.top;
      const right = winW - rect.right;
      const bottom = winH - rect.bottom;
      const left = rect.left;

      expandOverlay.style.transition = 'none';
      expandOverlay.style.clipPath = `inset(${top}px ${right}px ${bottom}px ${left}px)`;
      expandOverlay.classList.add('active');

      setTimeout(() => {
        expandOverlay.style.transition = 'clip-path 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
        expandOverlay.style.clipPath = 'inset(0px 0px 0px 0px)';
      }, 20);

      setTimeout(() => {
        window.location.href = 'page2.html';
      }, 520);
    }
  </script>

</body>
</html>
