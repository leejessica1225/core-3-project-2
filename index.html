<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Mess: - 메인</title>
  <style>
    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Lay Grotesk', sans-serif;
      font-weight: 400;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fff;
    }

    .container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* 헤더 영역 Flex 레이아웃 */
    .header {
      padding: 14px 20px;
      border-bottom: 2px solid #000;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .header h1 {
      font-size: 8.8vw;
      line-height: 0.92;
      font-weight: 500;
      letter-spacing: -0.025em;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      padding-top: 6px;
    }

    .nav-menu a {
      text-decoration: none;
      color: #000;
      font-size: 1.8vw;
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    .nav-menu a:hover {
      opacity: 0.6;
    }

    /* 중앙 회색 박스 영역 */
    .map-container {
      flex: 1;
      background-color: #d3d3d3;
      position: relative;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease;
    }

    .click-text {
      font-size: 1.3rem;
      color: #333;
      opacity: 0;
      transition: opacity 0.3s ease;
      user-select: none;
      font-weight: 400;
    }

    .map-container:hover {
      opacity: 0.75;
    }

    .map-container:hover .click-text {
      opacity: 1;
    }

    /* 푸터 영역 */
    .footer {
      padding: 14px 20px;
      border-top: 2px solid #000;
    }

    .footer p {
      font-size: 4.2vw;
      line-height: 1;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    /* 회색 박스 확장 애니메이션 레이어 */
    .gray-expand-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #d3d3d3;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transition: clip-path 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .gray-expand-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Urban Mess:</h1>
      <nav class="nav-menu">
        <a href="#">About</a>
        <a href="#">Text</a>
      </nav>
    </div>

    <div class="map-container" id="mapBox">
      <span class="click-text">click</span>
    </div>

    <div class="footer">
      <p>An Exhibition of Things We Throw Away</p>
    </div>
  </div>

  <div class="gray-expand-overlay" id="expandOverlay"></div>

  <script>
    const mapBox = document.getElementById('mapBox');
    const expandOverlay = document.getElementById('expandOverlay');

    mapBox.addEventListener('click', function() {
      const rect = mapBox.getBoundingClientRect();
      const winW = window.innerWidth;
      const winH = window.innerHeight;

      const top = rect.top;
      const right = winW - rect.right;
      const bottom = winH - rect.bottom;
      const left = rect.left;

      expandOverlay.style.transition = 'none';
      expandOverlay.style.clipPath = `inset(${top}px ${right}px ${bottom}px ${left}px)`;
      expandOverlay.classList.add('active');

      setTimeout(() => {
        expandOverlay.style.transition = 'clip-path 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
        expandOverlay.style.clipPath = 'inset(0px 0px 0px 0px)';
      }, 20);

      setTimeout(() => {
        window.location.href = 'page2.html';
      }, 520);
    });
  </script>

</body>
</html>
