<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Urban Mess: - Map</title>

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.js"></script>

  <style>
    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Lay Grotesk', sans-serif;
    }

    body, html {
      width: 100vw;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #d3d3d3;
    }

    #map {
      width: 100%;
      height: 100%;
      height: 100dvh;
      opacity: 1;
    }

    .mapboxgl-ctrl,
    .mapboxgl-ctrl-bottom-left,
    .mapboxgl-ctrl-bottom-right,
    .mapboxgl-ctrl-top-right,
    .mapboxgl-ctrl-top-left {
      display: none !important;
    }

    .marker-container {
      width: 42px;
      height: 42px;
      cursor: pointer;
    }

    .pinpoint-icon {
      width: 100%;
      height: 100%;
      background-image: url('pinpoint.svg');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;

      will-change: transform, opacity;
      animation: blink 1.2s infinite ease-in-out;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .marker-container:hover .pinpoint-icon {
      animation-play-state: paused;
      transform: scale(1.2);
      opacity: 1;
    }

    @keyframes blink {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.2;
        transform: scale(0.9);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 768px) {
      .marker-container {
        width: 30px;
        height: 30px;
      }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoibGVlamVzc2ljYTEyMjUiLCJhIjoiY212MDBlY3djMDEwNzJ5cHlmcm4ydTY5biJ9._rFqHdB2lQ_6yt18e02VkQ';

    const markerCoords = [-73.9818, 40.7305];

    const mapCenterCoords = [-73.99013, 40.73108];

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/leejessica1225/cmv06jab0005001s1fd8e551k',
      center: mapCenterCoords,
      zoom: window.innerWidth <= 768 ? 12.8 : 13.56,
      fadeDuration: 0
    });

    const containerEl = document.createElement('div');
    containerEl.className = 'marker-container';

    const iconEl = document.createElement('div');
    iconEl.className = 'pinpoint-icon';
    containerEl.appendChild(iconEl);


    containerEl.addEventListener('click', (e) => {
      e.stopPropagation(); 
      window.location.href = 'page3.html';
    });

    new mapboxgl.Marker({
      element: containerEl,
      anchor: 'center'
    })
      .setLngLat(markerCoords)
      .addTo(map);

    window.addEventListener('resize', () => {
      map.resize();
    });
  </script>

</body>
</html>
