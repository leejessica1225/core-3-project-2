<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Urban Mess: - Map</title>

  <!-- Mapbox GL JS v3 SDK -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.js"></script>

  <style>
    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Lay Grotesk', sans-serif;
    }

    body, html {
      width: 100vw;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #d3d3d3;
    }

    /* 반응형 지도 Viewport */
    #map {
      width: 100%;
      height: 100%;
      height: 100dvh;
      opacity: 1;
    }

    /* Mapbox 기본 컨트롤러 및 속성/로고 숨김 */
    .mapboxgl-ctrl,
    .mapboxgl-ctrl-bottom-left,
    .mapboxgl-ctrl-bottom-right,
    .mapboxgl-ctrl-top-right,
    .mapboxgl-ctrl-top-left {
      display: none !important;
    }

    /* 적절하게 조절된 은은한 모노톤 핀포인트 마커 */
    .custom-marker {
      width: 24px;
      height: 24px;
      background-color: #8E8E93;
      border: 2.5px solid #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .custom-marker:hover {
      transform: scale(1.2);
      background-color: #636366;
    }

    /* 모바일 화면 대응 스타일 조정 */
    @media (max-width: 768px) {
      .custom-marker {
        width: 18px;
        height: 18px;
        border-width: 2px;
      }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoibGVlamVzc2ljYTEyMjUiLCJhIjoiY212MDBlY3djMDEwNzJ5cHlmcm4ydTY5biJ9._rFqHdB2lQ_6yt18e02VkQ';

    // StuyTown과 East Village 사이 (14th St / 1st Ave 인근)
    const midLocationCoords = [-73.9818, 40.7305];

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/leejessica1225/cmv06jab0005001s1fd8e551k',
      center: midLocationCoords,
      zoom: window.innerWidth <= 768 ? 14.2 : 15.0,
      fadeDuration: 0
    });

    // 커스텀 핀포인트 마커 생성
    const el = document.createElement('div');
    el.className = 'custom-marker';

    new mapboxgl.Marker(el)
      .setLngLat(midLocationCoords)
      .addTo(map);

    // 창 크기 변경 시 지도 재정렬
    window.addEventListener('resize', () => {
      map.resize();
    });
  </script>

</body>
</html>
