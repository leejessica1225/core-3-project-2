<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Urban Mess: - Map</title>

  <!-- Mapbox GL JS v3 SDK -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.js"></script>

  <style>
    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Lay Grotesk', sans-serif;
    }

    body, html {
      width: 100vw;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #d3d3d3;
    }

    /* 반응형 지도 Viewport */
    #map {
      width: 100%;
      height: 100%;
      height: 100dvh;
      opacity: 1;
    }

    /* Mapbox 기본 컨트롤러 및 속성/로고 숨김 */
    .mapboxgl-ctrl,
    .mapboxgl-ctrl-bottom-left,
    .mapboxgl-ctrl-bottom-right,
    .mapboxgl-ctrl-top-right,
    .mapboxgl-ctrl-top-left {
      display: none !important;
    }

    /* 1. Mapbox 좌표용 바깥 래퍼 */
    .marker-container {
      width: 42px;
      height: 42px;
      cursor: pointer;
    }

    /* 2. pinpoint.svg 적용 및 깜빡임 애니메이션 */
    .pinpoint-icon {
      width: 100%;
      height: 100%;
      background-image: url('pinpoint.svg');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;

      /* SVG 그래픽 전용 선명도 옵션 및 부드러운 애니메이션 */
      will-change: transform, opacity;
      animation: blink 1.2s infinite ease-in-out;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    /* Hover 시 제자리에서 약간 확대 */
    .marker-container:hover .pinpoint-icon {
      animation-play-state: paused;
      transform: scale(1.2);
      opacity: 1;
    }

    /* 깜빡임 Keyframes */
    @keyframes blink {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.2;
        transform: scale(0.9);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* 모바일 화면 대응 스타일 */
    @media (max-width: 768px) {
      .marker-container {
        width: 30px;
        height: 30px;
      }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoibGVlamVzc2ljYTEyMjUiLCJhIjoiY212MDBlY3djMDEwNzJ5cHlmcm4ydTY5biJ9._rFqHdB2lQ_6yt18e02VkQ';

    // 1. 핀포인트 마커 위치 (StuyTown & East Village 사이)
    const markerCoords = [-73.9818, 40.7305];

    // 2. 전체 화각이 다 보이도록 설정하는 지도 중심 좌표
    const mapCenterCoords = [-73.99013, 40.73108];

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/leejessica1225/cmv06jab0005001s1fd8e551k',
      center: mapCenterCoords,
      zoom: window.innerWidth <= 768 ? 12.8 : 13.56,
      fadeDuration: 0
    });

    // 커스텀 마커 DOM 구조 생성 (바깥 래퍼 + 안쪽 아이콘)
    const containerEl = document.createElement('div');
    containerEl.className = 'marker-container';

    const iconEl = document.createElement('div');
    iconEl.className = 'pinpoint-icon';
    containerEl.appendChild(iconEl);

    // 핀포인트 클릭 시 page3.html로 이동하는 이벤트 핸들러 추가
    containerEl.addEventListener('click', (e) => {
      e.stopPropagation(); // 지도 자체의 클릭 이벤트와 충돌 방지
      window.location.href = 'page3.html';
    });

    // Mapbox Marker 생성 및 지도 추가
    new mapboxgl.Marker({
      element: containerEl,
      anchor: 'center'
    })
      .setLngLat(markerCoords)
      .addTo(map);

    // 창 크기 변경 시 지도 재정렬
    window.addEventListener('resize', () => {
      map.resize();
    });
  </script>

</body>
</html>
