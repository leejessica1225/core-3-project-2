<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Mess: - Map</title>

  <!-- Mapbox GL JS v3 SDK -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.js"></script>

  <style>
    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: 'Lay Grotesk';
      src: url('LayGrotesk-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Lay Grotesk', sans-serif;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #d3d3d3;
    }

    #map {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      opacity: 1;
    }

    /* Mapbox 컨트롤러 및 하단 속성/로고 숨김 */
    .mapboxgl-ctrl,
    .mapboxgl-ctrl-bottom-left,
    .mapboxgl-ctrl-bottom-right,
    .mapboxgl-ctrl-top-right,
    .mapboxgl-ctrl-top-left {
      display: none !important;
    }

    /* 커스텀 위치 아이콘 커스텀 스타일 */
    .stuytown-marker {
      width: 24px;
      height: 24px;
      background-color: #000;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .stuytown-marker:hover {
      transform: scale(1.2);
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoibGVlamVzc2ljYTEyMjUiLCJhIjoiY212MDBlY3djMDEwNzJ5cHlmcm4ydTY5biJ9._rFqHdB2lQ_6yt18e02VkQ';

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/leejessica1225/cmv06jab0005001s1fd8e551k',
      center: [-73.99013, 40.73108],
      zoom: 13.56,
      fadeDuration: 0
    });

    // 1. 마커로 사용할 HTML 엘리먼트 생성
    const el = document.createElement('div');
    el.className = 'stuytown-marker';

    // 2. StuyTown 좌표 지정 및 마커 지도 추가
    const stuytownCoords = [-73.9778, 40.7317];

    new mapboxgl.Marker(el)
      .setLngLat(stuytownCoords)
      .addTo(map);
  </script>

</body>
</html>
